<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>
    body {
      background: #fafafa;
      font-family: "Satoshi", system-ui, sans-serif;
    }
    gene-viewer {
      --gene-viewer-background-color: #fafafa;
    }
  </style>
</head>
<body>
  <div id="demo"></div>

  <script type="module">
    import { html, render } from 'lit';
    import '../dist/src/gene-viewer.js';
    import TestData from '../src/test.json' with { type: 'json' };

    render(
      html`
        <gene-viewer-custom parallelProbesets="3"></gene-viewer-custom>
        <gene-viewer viewerServer="http://localhost:5000/api/visualization" viewerId="homo_sapiens"></gene-viewer>
      `,
      document.querySelector('#demo')
    );

    const geneViewer = document.querySelector('gene-viewer-custom');
    geneViewer.setGene(TestData);
    geneViewer.showProbesets(["Oligoset 1", "Oligoset 2", "Oligoset 3"]);
    geneViewer.selectProbe("AARS1::12425");
  </script>
</body>
</html>
